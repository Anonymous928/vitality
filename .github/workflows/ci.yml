name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      # Fails if the database schema changed without a new snapshot.
      - run: dart run drift_dev make-migrations && git diff --exit-code drift_schemas/
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      # Release gate: the app must never request network access (decision D3).
      - run: bash tool/check_no_internet.sh
